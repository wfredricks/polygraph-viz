<!DOCTYPE html>
<html>
<head>
  <title>PolyGraph Viz — iFrame Example</title>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .viz-container {
      width: 100%;
      height: 600px;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <h1>iFrame Embedding</h1>
  <p>Embed the visualizer in any page via iframe. The visualizer runs on its own port.</p>

  <!-- Start polygraph-viz on port 4444, then embed: -->
  <div class="viz-container">
    <iframe src="http://localhost:4444"></iframe>
  </div>

  <h2>Code</h2>
  <pre><code>&lt;iframe src="http://localhost:4444" width="100%" height="600"&gt;&lt;/iframe&gt;</code></pre>

  <h2>With Theme Parameters</h2>
  <pre><code>&lt;iframe src="http://localhost:4444?theme=light&bg=ffffff&accent=3498db"&gt;&lt;/iframe&gt;</code></pre>
</body>
</html>
