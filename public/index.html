<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- @adopt:app-title  [resolved: pass --title to the CLI or set options.title; default is 'PolyGraph Viz'] -->
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>{{TITLE}}</h1>
        <button id="back-to-all" style="display:none" aria-label="Back to full graph">← All</button>
        <nav id="view-tabs" aria-label="View">
          <button data-view="force" class="active">Force</button>
          <button data-view="chord">Chord</button>
          <button data-view="sankey">Sankey</button>
        </nav>
        <input id="search" type="search" placeholder="Search nodes…" />
        <button id="refit-btn" aria-label="Refit visible nodes" title="Refit visible nodes">⊡</button>
        <button id="generate-btn" aria-label="Generate from checked labels" title="Generate story from graph">✦</button>
        <button id="connect-btn" aria-label="Draw connections between visible nodes" title="Draw connections">⛓</button>
        <button id="theme-toggle" aria-label="Toggle light / dark">🌓</button>
      </header>
      <main>
        <nav id="sidebar" aria-label="Label navigation"></nav>
        <section id="viz" aria-label="Graph view">
          <p class="placeholder">
            Step B placeholder. Renderers wire up in steps E (Force), G (Chord), H
            (Sankey). The toolbar is present so the shell is testable.
          </p>
        </section>
        <aside id="inspector" aria-label="Node details" hidden></aside>
      </main>
      <footer id="stats" aria-label="Graph stats">
        <span id="stats-counts">—</span>
      </footer>
    </div>
    <script type="module" src="/client.js?v=2d7c3554"></script>
  </body>
</html>
